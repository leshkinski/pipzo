[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pipzo-backend"
version = "0.1.0"
description = "Pipzo FastAPI backend contract skeleton"
requires-python = ">=3.9"
dependencies = [
  "cryptography>=42,<50",
  "fastapi>=0.111,<1",
  "pydantic-settings>=2.2,<3",
  "uvicorn[standard]>=0.29,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8,<9",
]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]

[tool.setuptools.packages.find]
where = ["backend"]
